# 记忆港湾 · 双服务：官网(web) + 小智 MCP(mcp)
#
# 本地：docker compose up -d --build
# Zeabur：见 ZEABUR.md（Dockerfile.web / Dockerfile.mcp）
#
# 访问官网：http://127.0.0.1:5000
# 密钥：根目录 .env 与 xiaozhi-mcp/.env 中 Token 一致

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: memory-harbor-web
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      FLASK_DEBUG: "0"
      MCP_API_BASE: "http://web:8080"
      DATA_DIR: "/data"
    volumes:
      - web_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: memory-harbor-mcp
    env_file:
      - ./xiaozhi-mcp/.env
    environment:
      WEBSITE_BASE: "http://web:8080"
      WEBSITE_MCP_TOKEN: "${MCP_API_TOKEN:-memory-harbor-mcp-dev-token}"
      MCP_API_TOKEN: "${MCP_API_TOKEN:-memory-harbor-mcp-dev-token}"
    volumes:
      - mcp_notes:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web_data:
  mcp_notes:
